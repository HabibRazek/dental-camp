name: CD - Continuous Deployment

on:
  push:
    branches: [ master ]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Job 1: Build and Push Docker Image
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDTIME=${{ github.event.head_commit.timestamp }}
            VERSION=${{ github.sha }}

  # Job 2: Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: staging
      url: https://staging.dental-camp.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging server
        run: |
          echo "✅ Staging deployment ready"
          echo "Image: ${{ needs.build-and-push.outputs.image-tag }}"
          echo "Note: Configure staging server to enable automatic deployment"
          echo "Skipping actual deployment (no staging server configured)"
          
      - name: Health check simulation
        run: |
          echo "✅ Health check passed (simulated)"
          echo "Configure STAGING_URL secret to enable real health checks"

  # Job 3: Deploy to Production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-staging]
    environment:
      name: production
      url: https://www.dental-camp.com
    if: github.ref == 'refs/heads/master'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production server
        run: |
          echo "✅ Production deployment ready"
          echo "Image: ${{ needs.build-and-push.outputs.image-tag }}"
          echo "Note: Configure production server to enable automatic deployment"
          echo "Skipping actual deployment (no production server configured)"
          
      - name: Health check simulation
        run: |
          echo "✅ Health check passed (simulated)"
          echo "Configure PRODUCTION_URL secret to enable real health checks"

      - name: Database migrations
        run: |
          echo "✅ Database migrations ready"
          echo "Run: kubectl exec -it <pod> -- npm run db:push"

  # Job 4: Deploy to Vercel (Alternative)
  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'

  # Job 5: Post-Deployment Verification
  verify:
    name: Post-Deployment Verification
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: github.ref == 'refs/heads/master'
    
    steps:
      - name: Verification summary
        run: |
          echo "✅ Deployment pipeline completed successfully!"
          echo "✅ Docker image built and pushed"
          echo "✅ Staging deployment ready"
          echo "✅ Production deployment ready"
          echo ""
          echo "Next steps:"
          echo "1. Configure staging/production servers"
          echo "2. Set up kubectl access for deployments"
          echo "3. Configure health check URLs"

  # Job 6: Rollback (Manual trigger)
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.rollback == 'true'
    
    steps:
      - name: Rollback to previous version
        run: |
          echo "Rolling back deployment..."
          # Add rollback script here

  # Job 7: Notification
  notify:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-production]
    if: always()
    
    steps:
      - name: Send Slack notification
        run: |
          echo "Deployment completed!"
          echo "Status: ${{ needs.deploy-production.result }}"
          # Add Slack webhook notification here
