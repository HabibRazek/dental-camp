# ================================
# IMPORTANT: This is a template file
# Replace base64 encoded values with actual secrets
# Create secrets using: echo -n 'your-secret' | base64
# ================================

apiVersion: v1
kind: Secret
metadata:
  name: dental-camp-secrets
  namespace: dental-camp
type: Opaque
data:
  # Database credentials (base64 encoded)
  DATABASE_URL: <BASE64_ENCODED_DATABASE_URL>
  
  # Auth secrets (base64 encoded)
  AUTH_SECRET: <BASE64_ENCODED_AUTH_SECRET>
  AUTH_GOOGLE_ID: <BASE64_ENCODED_GOOGLE_ID>
  AUTH_GOOGLE_SECRET: <BASE64_ENCODED_GOOGLE_SECRET>
  
  # UploadThing token (base64 encoded)
  UPLOADTHING_TOKEN: <BASE64_ENCODED_UPLOADTHING_TOKEN>
  
  # SMTP credentials (base64 encoded)
  SMTP_USER: <BASE64_ENCODED_SMTP_USER>
  SMTP_PASS: <BASE64_ENCODED_SMTP_PASS>
  SMTP_FROM: <BASE64_ENCODED_SMTP_FROM>

---
# Example of how to create secrets via command line:
# kubectl create secret generic dental-camp-secrets \
#   --from-literal=DATABASE_URL='your-database-url' \
#   --from-literal=AUTH_SECRET='your-auth-secret' \
#   --namespace=dental-camp
